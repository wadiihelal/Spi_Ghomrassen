# Serveur de test (Lot 1 bis, 15/09/2026) : le compose de production, plus le jeu de donnees
# fictif « demo ». Jamais sur des donnees reelles.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# Acces libre (15/09/2026) : le client entre sans mot de passe. Voir l'avertissement en tete de
# frontend/nginx.demo.conf et docs/SERVEUR-DE-TEST.md.
services:
  postgres:
    # Sur le serveur, PostgreSQL n'a pas a etre joignable depuis l'hote : le backend le trouve par
    # le reseau Docker. Rien n'est publie, donc aucun conflit avec une autre base deja sur 5432.
    ports: !override []
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod,demo
  frontend:
    # « !override » remplace la liste du compose de base au lieu de s'y ajouter (Compose >= 2.24).
    # Sur un serveur qui sert deja un site sur le port 80, fixer DEMO_HTTP_PORT dans .env.
    ports: !override
      - "${DEMO_HTTP_PORT:-80}:80"
    volumes:
      - ./frontend/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
