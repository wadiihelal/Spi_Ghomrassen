name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: ng build
        working-directory: frontend
        run: npx ng build

  images:
    name: Images Docker (ce qui est déployé)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Les jobs ci-dessus compilent dans leur propre environnement ; le serveur, lui, construit
      # ces images. Un fichier oublie dans un COPY ne casse que cette construction-la — c'est
      # arrive avec frontend/.npmrc le 15/09/2026. On construit donc ce qui part vraiment.
      - name: docker compose build (serveur de test)
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml build

  demo:
    name: Démonstration de bout en bout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cette etape execute les commandes de docs/SERVEUR-DE-TEST.md, telles quelles : si le
      # guide se trompe, la CI se trompe avec lui et echoue. C'est ainsi qu'un htpasswd illisible
      # par l'utilisateur nginx — 500 sur toutes les pages, constate le 15/09/2026 — se voit ici
      # plutot que chez le client.
      - name: Mots de passe, comme dans le guide
        run: |
          printf 'spi:%s\n' "$(openssl passwd -apr1 mot-de-passe-de-ci)" > htpasswd && chmod 644 htpasswd
          printf 'DB_PASSWORD=%s\nDEMO_HTTP_PORT=8088\n' "$(openssl rand -base64 24)" > .env
      - name: Lancer la démonstration
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
      - name: L'interface et l'API répondent derrière le mot de passe
        run: |
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/projects)" = "401" ] && break
            sleep 5
          done
          echo "401 sans identifiant :"; test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/projects)" = "401"
          echo "200 avec identifiant :"; test "$(curl -s -o /dev/null -u spi:mot-de-passe-de-ci -w '%{http_code}' http://localhost:8088/api/projects)" = "200"
          echo "l'interface est servie :"; test "$(curl -s -o /dev/null -u spi:mot-de-passe-de-ci -w '%{http_code}' http://localhost:8088/)" = "200"
          echo "les résidences de démonstration sont chargées :"
          curl -s -u spi:mot-de-passe-de-ci http://localhost:8088/api/projects | grep -q "SPI-DEMO-RES-A"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail=80

  postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Le compose du serveur de test (Lot 1 bis) doit rester fusionnable avec celui de production.
      - name: docker compose config (serveur de test)
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml config -q
      # Les tests @Tag("postgres") demandent un demon Docker, absent du poste de developpement
      # et present ici. Seuls ces tests tournent : la suite H2 est deja couverte par le job Backend.
      - name: mvn verify -Ppostgres (tests PostgreSQL seuls)
        working-directory: backend
        run: mvn -B verify -Ppostgres -Dgroups=postgres -DfailIfNoTests=true
      # La preuve que les classes ont tourne. Les logs d'un run ne sont pas lisibles sans
      # connexion GitHub, les annotations le sont : les comptes y sont publies, et l'etape echoue
      # si moins de cinq classes @Tag("postgres") ou huit tests ont tourne — un vert vide est exclu.
      - name: Résumé des tests PostgreSQL
        if: always()
        working-directory: backend
        run: |
          files=$(ls target/surefire-reports/*.txt 2>/dev/null | wc -l)
          total=$(grep -h "Tests run:" target/surefire-reports/*.txt 2>/dev/null | sed -E 's/Tests run: ([0-9]+).*/\1/' | awk '{s+=$1} END {print s+0}')
          detail=$(for f in target/surefire-reports/*.txt; do printf '%s %s | ' "$(basename "$f" .txt | sed 's/.*\.//')" "$(grep -h 'Tests run:' "$f" | sed -E 's/, Time elapsed.*//')"; done)
          echo "::notice title=Tests PostgreSQL ($files classes, $total tests)::$detail"
          { echo "### Tests PostgreSQL ($files classes, $total tests)"; echo; echo "$detail" | tr '|' '\n'; } >> "$GITHUB_STEP_SUMMARY"
          test "$files" -ge 5 && test "$total" -ge 8
