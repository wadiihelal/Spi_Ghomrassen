server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'application Angular est une SPA : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # environment.prod.ts pointe sur /api : le proxy evite tout probleme de CORS et permet
    # de ne publier qu'un seul port.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
