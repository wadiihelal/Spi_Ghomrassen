# Variante « serveur de test » de nginx.conf (Lot 1 bis) : identique, plus un mot de passe
# partage devant tout le site — interface et /api — parce que l'application n'a pas
# d'authentification (SEC-01) et que ce serveur est joignable depuis Internet.
# Montee par docker-compose.demo.yml a la place de nginx.conf ; nginx.conf reste la production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "SPI Ghomrassen - demonstration";
    auth_basic_user_file /etc/nginx/htpasswd;

    # L'application Angular est une SPA : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # environment.prod.ts pointe sur /api : le proxy evite tout probleme de CORS et permet
    # de ne publier qu'un seul port.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
