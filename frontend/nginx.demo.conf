# Variante « serveur de test » de nginx.conf (Lot 1 bis). Identique a la production, a une
# difference pres : elle sert la demonstration sur le port choisi par DEMO_HTTP_PORT.
#
# ACCES LIBRE, decide le 15/09/2026 : le client ouvre l'adresse et entre directement dans
# l'application, sans mot de passe. L'application n'ayant aucune authentification (SEC-01),
# quiconque connait l'adresse peut lire ET SUPPRIMER n'importe quel enregistrement. C'est
# assume parce que les donnees sont fictives et que « docker compose down -v » les recree en
# une minute (docs/SERVEUR-DE-TEST.md, § 8). Ne jamais servir de vraies donnees ainsi.
#
# Pour remettre un mot de passe partage : creer un fichier htpasswd
# (openssl passwd -apr1, chmod 644 — les ouvriers nginx tournent sous l'utilisateur nginx, un
# fichier en 600 root:root leur est illisible et toutes les pages repondent 500), le monter sur
# /etc/nginx/htpasswd dans docker-compose.demo.yml, et decommenter les deux lignes auth_basic.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # auth_basic "SPI Ghomrassen - demonstration";
    # auth_basic_user_file /etc/nginx/htpasswd;

    # L'application Angular est une SPA : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # environment.prod.ts pointe sur /api : le proxy evite tout probleme de CORS et permet
    # de ne publier qu'un seul port.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
