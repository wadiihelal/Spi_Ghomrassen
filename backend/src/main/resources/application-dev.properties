# PostgreSQL local (voir docker-compose.yml a la racine du projet)
spring.datasource.url=jdbc:postgresql://localhost:5432/spi_ghomrassen
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:spi}
spring.datasource.password=${DB_PASSWORD:spi}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Hors du dossier de l'application : un redeploiement ne doit jamais emporter les pieces.
app.storage.root=${user.home}/.spi-ghomrassen/attachments
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
