# Messages de validation Jakarta, en francais (API-02, I18N-01).
#
# Sans ce fichier, les messages venaient du bundle par defaut d'Hibernate Validator, resolu
# selon la locale de la JVM : « must not be blank » sur un serveur en en_US ou en_TN, du
# francais ailleurs. Toute la console est en francais sauf ces messages-la, qui remontent
# pourtant tels quels dans le toast d'erreur (details, champ par champ).
#
# C'est le bundle SANS suffixe de locale qui est renseigne, et c'est deliberé : l'application
# est francophone uniquement, donc le francais est le defaut, pas une traduction. Aucune locale
# de serveur ne peut plus changer la langue affichee.
#
# Accents en echappement unicode, comme dans application.properties. Hibernate Validator
# charge ce bundle en ISO-8859-1 et non en UTF-8 : ecrits directement, les accents arrivent
# deformes jusque dans le toast de la console (« Ce champ ne peut pas Ãªtre vide »). Constate,
# pas suppose — GlobalExceptionHandlerTest assere le texte francais exact, donc l'encodage.
#
# Seules les contraintes reellement utilisees dans dto/ sont traduites ; une contrainte non
# listee retombe sur le message anglais d'Hibernate Validator, ce que
# GlobalExceptionHandlerTest detecterait.

jakarta.validation.constraints.NotNull.message=Ce champ est obligatoire.
jakarta.validation.constraints.NotBlank.message=Ce champ ne peut pas \u00eatre vide.
jakarta.validation.constraints.NotEmpty.message=Au moins une valeur est requise.
jakarta.validation.constraints.Positive.message=La valeur doit \u00eatre strictement sup\u00e9rieure \u00e0 z\u00e9ro.
jakarta.validation.constraints.PositiveOrZero.message=La valeur ne peut pas \u00eatre n\u00e9gative.
jakarta.validation.constraints.Size.message=La longueur doit \u00eatre comprise entre {min} et {max} caract\u00e8res.
jakarta.validation.constraints.Email.message=L'adresse \u00e9lectronique n'est pas valide.
