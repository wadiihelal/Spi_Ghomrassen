spring.application.name=spi-ghomrassen-backend
server.port=8080

# Profil par defaut : dev. Surcharger avec --spring.profiles.active=prod
spring.profiles.active=dev

# Le schema est gere exclusivement par Flyway ; Hibernate ne fait que le verifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# La console H2 n'est activee dans aucun profil (voir SEC-02).
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Pieces jointes (FE-05) : 10 Mo par fichier, la limite metier est la meme dans
# AttachmentServiceImpl. La racine de stockage est definie par profil.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Documentation OpenAPI (API-02) : desactivee par defaut, ouverte par les profils dev et test.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html

app.cors.allowed-origins=http://localhost:4200,http://localhost:3000
