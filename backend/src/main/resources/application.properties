spring.application.name=spi-ghomrassen-backend
server.port=8080

# Profil par defaut : dev. Surcharger avec --spring.profiles.active=prod
spring.profiles.active=dev

# Le schema est gere exclusivement par Flyway ; Hibernate ne fait que le verifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# La console H2 n'est activee dans aucun profil (voir SEC-02).
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

app.cors.allowed-origins=http://localhost:4200,http://localhost:3000
