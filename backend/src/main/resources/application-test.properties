# H2 en memoire, schema construit par les memes migrations Flyway que la production.
spring.datasource.url=jdbc:h2:mem:spi_ghomrassen_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

app.storage.root=${java.io.tmpdir}/spi-ghomrassen-test-attachments

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
