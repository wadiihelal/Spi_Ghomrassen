# Profil de test PostgreSQL (WP1). Il s'ajoute au profil `test` : @ActiveProfiles({"test",
# "postgres"}), et ne sert qu'aux classes qui heritent d'AbstractPostgresTest.
#
# Le profil `test` fixe H2Dialect, ce qui gagnerait sur la detection automatique et ferait
# parler Hibernate en H2 a une base PostgreSQL. On le remplace explicitement plutot que de le
# vider : `spring.jpa.database-platform=` sans valeur passe hibernate.dialect="" a Hibernate,
# dont le comportement depend de la version.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# L'URL, l'utilisateur et le mot de passe viennent du conteneur via @ServiceConnection : ne rien
# declarer ici, ce qui serait ecrase de toute facon.
# Le schema reste construit par les memes migrations Flyway que la production, et verifie par
# Hibernate. C'est tout l'objet du lot : les confronter au vrai dialecte.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
# Les requetes generees sont l'objet de plusieurs assertions ; les journaliser aide au
# diagnostic quand un test PostgreSQL diverge de son equivalent H2.
spring.jpa.show-sql=false
# Pool volontairement plus large que les 10 connexions par defaut de Hikari.
#
# Toute ecriture consomme DEUX connexions en meme temps : la transaction metier tient la sienne
# pendant que AuditLogServiceImpl.create, annote REQUIRES_NEW, en ouvre une seconde pour
# journaliser. Avec 10 connexions et 10 ecritures simultanees, les dix transactions metier
# prennent tout le pool puis attendent chacune une onzieme connexion qui n'arrivera jamais :
# blocage jusqu'au timeout de 30 s, puis echec.
#
# C'est un constat sur la PRODUCTION, pas un besoin des tests : spring.datasource ne fixe
# aucune taille de pool, donc le defaut de 10 s'applique au deploiement reel. Le pool est
# elargi ici pour que PostgresReferenceSequenceTest mesure ce qu'il annonce — l'unicite des
# references sous concurrence (DATA-03) — et non la taille du pool. Voir README.md.
spring.datasource.hikari.maximum-pool-size=25
