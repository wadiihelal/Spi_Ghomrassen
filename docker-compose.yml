services:
  postgres:
    image: postgres:16
    container_name: spi-ghomrassen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spi_ghomrassen
      POSTGRES_USER: spi
      # Surchargeable par un fichier .env (serveur de test) ; « spi » reste le defaut du poste.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spi}
    ports:
      # Lie a la boucle locale : « mvn spring-boot:run » sur le poste y accede toujours, mais
      # sur un serveur PostgreSQL n'est plus expose a Internet (Lot 1 bis).
      - "127.0.0.1:5432:5432"
    volumes:
      - spi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spi -d spi_ghomrassen"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: spi-ghomrassen-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/spi_ghomrassen
      DB_USER: spi
      DB_PASSWORD: ${DB_PASSWORD:-spi}
      # L'interface est servie par nginx sur le meme hote et appelle /api : aucune origine
      # externe n'est autorisee par defaut.
      APP_CORS_ALLOWED_ORIGINS: http://localhost
      # Pieces jointes (FE-05) : volume nomme, a sauvegarder avec la base.
      ATTACHMENTS_ROOT: /var/lib/spi-ghomrassen/attachments
    volumes:
      - spi-attachments:/var/lib/spi-ghomrassen/attachments
    # Pas de "ports:" — le backend n'est joignable que par le service frontend.
    # L'application n'a pas d'authentification (SEC-01) : ne jamais publier 8080.
    expose:
      - "8080"

  frontend:
    build: ./frontend
    container_name: spi-ghomrassen-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  spi-postgres-data:
  spi-attachments:
